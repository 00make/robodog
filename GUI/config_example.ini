# 机器狗统一控制中心配置文件
# 您可以修改这些参数来自定义控制体验

[连接设置]
# 默认机器狗IP地址
DEFAULT_HOST = "192.168.118.29"

# 连接超时时间（秒）
CONNECTION_TIMEOUT = 5

[控制参数]
# 速度等级 (m/s) - 可以添加或修改速度档位
SPEED_LEVELS = [0.2, 0.5, 0.8, 1.2, 1.5, 2.0]

# 默认速度等级索引 (0-based)
DEFAULT_SPEED_INDEX = 2

# 身高等级 (m) - 可以添加或修改身高档位
HEIGHT_LEVELS = [0.15, 0.20, 0.25, 0.30, 0.35]

# 默认身高等级索引 (0-based)
DEFAULT_HEIGHT_INDEX = 2

# 最大转向速度 (rad/s)
MAX_TURN_SPEED = 1.0

# 默认摇杆死区
DEFAULT_DEADZONE = 0.1

[键盘映射]
# 键盘控制映射 - 可以自定义按键
# 格式: 按键 = [vx, vy, wz, 显示名称]
MOVEMENT_KEYS = {
    "w": [1.0, 0.0, 0.0, "前进"],
    "s": [-1.0, 0.0, 0.0, "后退"],
    "a": [0.0, 1.0, 0.0, "左移"],
    "d": [0.0, -1.0, 0.0, "右移"],
    "q": [0.0, 0.0, 1.0, "左转"],
    "e": [0.0, 0.0, -1.0, "右转"]
}

# 方向键映射
ARROW_KEY_MAPPING = {
    "Up": "w",
    "Down": "s",
    "Left": "a", 
    "Right": "d"
}

[手柄设置]
# 手柄按钮映射 (Xbox手柄标准)
GAMEPAD_BUTTONS = {
    0: "A",      # A按钮 - 降低身高
    1: "B",      # B按钮 - 紧急停止
    2: "X",      # X按钮 - 重置姿态
    3: "Y",      # Y按钮 - 升高身高
    4: "LB",     # 左肩键
    5: "RB",     # 右肩键
    6: "BACK",   # 返回键
    7: "START",  # 开始键 - 停止控制
    8: "LS",     # 左摇杆按下
    9: "RS"      # 右摇杆按下
}

# 手柄轴映射
GAMEPAD_AXES = {
    0: "LEFT_X",    # 左摇杆 X轴 (左右移动)
    1: "LEFT_Y",    # 左摇杆 Y轴 (前后移动)
    2: "RIGHT_X",   # 右摇杆 X轴 (旋转)
    3: "RIGHT_Y",   # 右摇杆 Y轴 (备用)
    4: "LT",        # 左扳机
    5: "RT"         # 右扳机
}

[界面设置]
# 窗口默认大小
WINDOW_WIDTH = 1200
WINDOW_HEIGHT = 800

# 状态更新频率 (Hz)
STATUS_UPDATE_RATE = 20

# 日志保留行数
MAX_LOG_LINES = 100

# 实时状态更新间隔 (秒)
REALTIME_UPDATE_INTERVAL = 1.0

[安全设置]
# 紧急停止后的延迟时间 (秒)
EMERGENCY_STOP_DELAY = 0.1

# 自动重置姿态 (程序退出时)
AUTO_RESET_ON_EXIT = true

# 最大连续操作时间 (分钟) - 0表示无限制
MAX_OPERATION_TIME = 0

[高级设置]
# 调试模式 - 显示详细日志
DEBUG_MODE = false

# 启用详细状态显示
VERBOSE_STATUS = true

# 自动连接上次使用的IP
AUTO_CONNECT_LAST_IP = false

# 记住窗口位置和大小
REMEMBER_WINDOW_GEOMETRY = true

# 启动时自动检查手柄
AUTO_CHECK_GAMEPAD = true

# 启动时自动启动键盘监听
AUTO_START_KEYBOARD = false

[网络设置]
# 控制命令发送频率 (Hz)
CONTROL_COMMAND_RATE = 20

# 网络超时设置 (秒)
NETWORK_TIMEOUT = 1.0

# 重连尝试次数
RECONNECT_ATTEMPTS = 3

# 重连间隔 (秒)
RECONNECT_INTERVAL = 2.0

[性能设置]
# GUI刷新率 (Hz)
GUI_REFRESH_RATE = 30

# 控制线程优先级 (1-10, 10最高)
CONTROL_THREAD_PRIORITY = 8

# 内存优化 - 定期清理日志
MEMORY_OPTIMIZATION = true

# 日志文件保存 (如果启用)
SAVE_LOG_TO_FILE = false
LOG_FILE_PATH = "robodog_control.log"
